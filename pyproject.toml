[project]
name = "graph-based-financial-crime"
version = "0.1.0"
description = "Graph-based financial crime analytics using SAML-D and PageRank"
authors = [
    { name = "Gorkem Yencak" }
]
requires-python = ">=3.14,!=3.14.1,<3.15"
dependencies = ["pandas (>=3.0.5,<4.0.0)", "numpy (>=2.5.2,<3.0.0)", "polars (>=1.44.1,<2.0.0)", "pyarrow (>=25.0.1,<26.0.0)", "duckdb (>=1.5.5,<2.0.0)", "kagglehub (>=1.0.2,<2.0.0)", "networkx (>=3.6.1,<4.0.0)", "igraph (>=1.0.0,<2.0.0)", "scipy (>=1.18.1,<2.0.0)", "scikit-learn (>=1.9.0,<2.0.0)", "matplotlib (>=3.11.1,<4.0.0)", "seaborn (>=0.13.2,<0.14.0)", "joblib (>=1.5.3,<2.0.0)", "tqdm (>=4.70.0,<5.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.4,<0.17.0)"
]
